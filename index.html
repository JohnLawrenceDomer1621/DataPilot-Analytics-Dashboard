<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPilot Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
</head>
<body>

    <!-- Navigation -->

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">
                📊 DataPilot
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarContent">

                <ul class="navbar-nav ms-auto">

\

                </ul>

            </div>

        </div>
    </nav>

    <!-- Hero Section -->

    <section class="hero-section">

        <div class="container text-center">

            <h1 class="hero-title">
                Automated Data Cleaning & Visualization
            </h1>

            <p class="hero-subtitle">
                Upload CSV or Excel files and generate powerful
                business insights instantly.
            </p>

            <div class="hero-buttons">

                <button class="btn btn-primary btn-lg">
                    Upload Dataset
                </button>

                <button class="btn btn-outline-light btn-lg">
                    View Demo
                </button>

            </div>

        </div>

    </section>

    <!-- Upload Section -->

    <section class="container">

        <div class="card-custom">

            <h3>Upload Dataset</h3>

            <input
                type="file"
                id="fileInput"
                accept=".csv,.xlsx,.xls"
                class="form-control">

            <button
                onclick="processFile()"
                class="btn btn-info mt-3">

                Analyze Dataset

            </button>

        </div>

    </section>

    <!-- KPI CARDS -->

    <section class="container mt-4">

        <div class="row g-4">

            <div class="col-md-3">
                <div class="kpi-card">
                    <h2 id="rows">0</h2>
                    <p>Total Rows</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="kpi-card">
                    <h2 id="cols">0</h2>
                    <p>Columns</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="kpi-card">
                    <h2 id="missing">0</h2>
                    <p>Missing Values</p>
                </div>
            </div>

            <div class="col-md-3">
                <div class="kpi-card">
                    <h2 id="duplicates">0</h2>
                    <p>Duplicates</p>
                </div>
            </div>

        </div>

    </section>

    <!-- AI Insights -->

    <section class="container mt-4">

        <div class="card-custom">

            <h3>AI Insights</h3>

            <div id="insights"></div>

        </div>

    </section>

    <!-- Charts -->

    <section class="container mt-4">

        <div class="row g-4">

            <div class="col-lg-6">
                <div class="chart-card">
                    <div id="histogram"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="chart-card">
                    <div id="boxplot"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="chart-card">
                    <div id="piechart"></div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="chart-card">
                    <div id="scatterplot"></div>
                </div>
            </div>

        </div>

    </section>


<section class="container mt-4">

    <div class="card-custom">

        <h3>📊 Missing Values Analysis</h3>

        <div id="missingValueChart"></div>

    </div>

</section>



<section class="container mt-4">

    <div class="card-custom">

        <h3>📋 Full Dataset Explorer</h3>

        <table id="dataTable" class="display"
               style="width:100%">
        </table>

    </div>

</section>



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<link rel="stylesheet"
href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>


    <script src="app.js"></script>

</body>
</html>
